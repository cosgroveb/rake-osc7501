name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release-artifact:
        description: Prepared release bundle from the calling workflow
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ inputs.release-artifact == '' }}

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ruby: "3.3"
            rspec_minor: "3.12"
            rspec_core: "3.12.0"
          - os: ubuntu-latest
            ruby: "3.3"
            rspec_minor: "3.13"
            rspec_core: "~> 3.13.0"
          - os: ubuntu-latest
            ruby: "3.4"
            rspec_minor: "3.13"
            rspec_core: "~> 3.13.0"
          - os: ubuntu-latest
            ruby: "4.0"
            rspec_minor: "3.13"
            rspec_core: "~> 3.13.0"
          - os: ubuntu-latest
            ruby: "4.0"
            rspec_minor: "4.0"
            rspec_core: "4.0.0.beta1"
            rspec_version: "4.0.0.beta1"
          - os: macos-latest
            ruby: "3.4"
            rspec_minor: "3.13"
            rspec_core: "~> 3.13.0"
          - os: ubuntu-22.04
            ruby: "2.1"
            rspec_minor: "3.6"
            rspec_core: "3.6.0"
            gemfile: Gemfile.compat
            bundler: "1.17.3"
          - os: ubuntu-22.04
            ruby: "2.1"
            rspec_minor: "3.13"
            rspec_core: "~> 3.13.0"
            gemfile: Gemfile.compat
            bundler: "1.17.3"
          - os: ubuntu-22.04
            ruby: "2.7"
            rspec_minor: "3.9"
            rspec_core: "~> 3.9.0"
            gemfile: Gemfile.compat
            bundler: "2.4.22"
          - os: ubuntu-22.04
            ruby: "3.1"
            rspec_minor: "3.12"
            rspec_core: "3.12.0"
            gemfile: Gemfile.compat
            bundler: "2.4.22"
          - os: ubuntu-22.04
            ruby: "3.4"
            rspec_minor: "3.6"
            rspec_core: "3.6.0"
            gemfile: Gemfile.compat
            bundler: "2.6.9"
    runs-on: ${{ matrix.os }}
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile || 'Gemfile' }}
      RSPEC_MINOR: ${{ matrix.rspec_minor }}
      RSPEC_CORE_VERSION: ${{ matrix.rspec_core }}
      RSPEC_VERSION: ${{ matrix.rspec_version || format('~> {0}.0', matrix.rspec_minor) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: inputs.release-artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.release-artifact }}
          path: ${{ runner.temp }}/release
      - if: inputs.release-artifact != ''
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: "3.4"
          bundler: none
          bundler-cache: false
      - if: inputs.release-artifact != ''
        run: ruby script/release.rb restore "$RUNNER_TEMP/release"
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: ${{ matrix.bundler || 'default' }}
          bundler-cache: true
          cache-version: ${{ matrix.ruby }}-${{ matrix.gemfile || 'Gemfile' }}-${{ matrix.rspec_minor }}-${{ matrix.rspec_core }}
      - name: Install actionlint
        if: matrix.os == 'ubuntu-latest' && matrix.ruby == '3.4'
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Check code quality
        if: matrix.os == 'ubuntu-latest' && matrix.ruby == '3.4'
        run: bundle exec rake quality
      - if: matrix.gemfile != 'Gemfile.compat'
        run: bundle exec rake spec smoke rdoc
      - name: Check runtime compatibility
        if: matrix.gemfile == 'Gemfile.compat'
        run: |
          # RSpec 3.6 cannot parse option files with modern ERB.
          bundle exec rspec --options '' spec/rake
          bundle exec gem build rake-osc7501.gemspec
          bundle exec ruby script/smoke.rb rake-osc7501-*.gem

  pure-rake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: inputs.release-artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.release-artifact }}
          path: ${{ runner.temp }}/release
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: "3.4"
          bundler: none
          bundler-cache: false
      - if: inputs.release-artifact != ''
        run: ruby script/release.rb restore "$RUNNER_TEMP/release"
      - run: gem install rake --no-document
      - name: Check installed gem without RSpec
        run: |
          gem build rake-osc7501.gemspec --output "$RUNNER_TEMP/rake-osc7501.gem"
          ruby -rrake script/smoke.rb "$RUNNER_TEMP/rake-osc7501.gem"

  integration:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '2.1'
            gemfile: Gemfile.compat
            bundler: '1.17.3'
          - ruby: '3.4'
            gemfile: Gemfile.integration
            bundler: default
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}
      RSPEC_OSC7501_PATH: ${{ github.workspace }}/tmp/rspec-osc7501-0.1.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: inputs.release-artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.release-artifact }}
          path: ${{ runner.temp }}/release
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: "3.4"
          bundler: none
          bundler-cache: false
      - name: Unpack released companion
        run: |
          curl --fail --silent --show-error https://rubygems.org/downloads/rspec-osc7501-0.1.4.gem -o "$RUNNER_TEMP/rspec-osc7501-0.1.4.gem"
          gem unpack "$RUNNER_TEMP/rspec-osc7501-0.1.4.gem" --target "$GITHUB_WORKSPACE/tmp"
          gem specification "$RUNNER_TEMP/rspec-osc7501-0.1.4.gem" --ruby > "$RSPEC_OSC7501_PATH/rspec-osc7501.gemspec"
      - if: inputs.release-artifact != ''
        run: ruby script/release.rb restore "$RUNNER_TEMP/release"
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: ${{ matrix.bundler }}
          bundler-cache: true
      - run: bundle exec rspec spec/rake
      - if: matrix.gemfile == 'Gemfile.compat'
        run: |
          bundle exec gem build rake-osc7501.gemspec
          mkdir -p pkg
          mv rake-osc7501-*.gem pkg/
      - if: matrix.gemfile != 'Gemfile.compat'
        run: bundle exec rake package
      - run: |
          bundle exec ruby script/smoke.rb pkg/rake-osc7501-*.gem "$RUNNER_TEMP/rspec-osc7501-0.1.4.gem"
